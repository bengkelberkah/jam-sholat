<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jam Sholat Ringan</title>
<style>
body {
  font-family: 'Arial', sans-serif;
  background: #000;
  color: #0f0;
  text-align: center;
  margin: 0;
  padding: 10px;
}
h1 {font-size: 1.3em; color: #0ff;}
#clock {font-size: 2.5em; margin: 10px 0; font-weight: bold;}
#timeleft {font-size: 1.3em; margin-bottom: 15px;}
#nextPrayer {font-size: 1.1em; color: #fff;}
table {width: 100%; color: #0f0; font-size: 0.9em; border-collapse: collapse; margin-top: 10px;}
td, th {border: 1px solid #0f0; padding: 5px;}
button {background: #0f0; color: #000; padding: 8px 15px; border: none; border-radius: 5px; cursor: pointer;}
button:active {background: #0c0;}
input, select {
  margin: 5px; padding: 5px;
  width: 90%; border-radius: 5px;
  border: 1px solid #0f0; background: #000; color: #0f0;
}
.small {font-size: 0.8em; color: #888;}
</style>
</head>
<body>
<h1>🕌 JAM SHOLAT</h1>
<div id="clock">00:00:00</div>
<div id="timeleft">Menunggu data...</div>
<div id="nextPrayer"></div>

<div>
  <input id="city" placeholder="Kota (contoh: Bandung)" />
  <input id="country" placeholder="Negara (contoh: Indonesia)" />
  <select id="method">
    <option value="12">Syafi'i (Karachi)</option>
    <option value="1">Hanafi (MWL)</option>
    <option value="3">ISNA</option>
    <option value="4">Umm Al-Qura</option>
  </select>
  <button id="btnLoad">Muat Waktu</button>
</div>

<table id="times"></table>
<p class="small">Auto update setiap hari & kirim ke M5 setiap detik</p>

<script>
const el = id => document.getElementById(id);
let currentClock = '00:00:00';
let currentCountdown = '00:00:00';
let nextPrayerName = '-';
let lastData = null;
let countdownInterval;

const M5CORE_URL = "http://192.168.0.150/update"; // ubah ke IP M5Core Ink kamu

function stripTZ(s) {return (s||'').toString().match(/\d{1,2}:\\d{2}/)?.[0] || s;}
function composeDateTime(t){const [h,m]=stripTZ(t).split(':').map(Number);const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate(),h,m,0);}
function adjustTime(t,o){const d=composeDateTime(t);d.setMinutes(d.getMinutes()+o);return `${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;}
function computeNext(t){const k=['Fajr','Sunrise','Dhuhr','Asr','Maghrib','Isha'];const now=Date.now();for(const key of k){const d=composeDateTime(t[key]);if(d.getTime()>now)return{key,at:d};}const tm=new Date(Date.now()+86400000);const[h,m]=stripTZ(t['Fajr']).split(':').map(Number);return{key:'Fajr',at:new Date(tm.getFullYear(),tm.getMonth(),tm.getDate(),h,m,0)};}

async function fetchByCity(city,country,method){const url=`https://api.aladhan.com/v1/timingsByCity?city=${encodeURIComponent(city)}&country=${encodeURIComponent(country)}&method=${method}`;const r=await fetch(url);const j=await r.json();if(j.code!==200)throw new Error('Gagal ambil data');return j.data;}

function updateClock(){
  const n=new Date();const h=String(n.getHours()).padStart(2,'0');const m=String(n.getMinutes()).padStart(2,'0');const s=String(n.getSeconds()).padStart(2,'0');
  currentClock=`${h}:${m}:${s}`;el('clock').textContent=currentClock;
}
setInterval(updateClock,1000);

function updateTimeLeft(next){
  const now=new Date();const diff=next.at-now;if(diff<=0){el('timeleft').textContent='Masuk waktu sholat berikutnya';return;}
  const t=Math.floor(diff/1000),h=Math.floor(t/3600),m=Math.floor((t%3600)/60),s=t%60;
  currentCountdown=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  el('timeleft').textContent=`Menuju ${next.key}: ${currentCountdown}`;
  el('nextPrayer').textContent=`Sholat berikutnya: ${next.key}`;
  nextPrayerName=next.key;
}

function updateUI(data){
  lastData=data;
  const t=data.timings;
  let html='<tr><th>Sholat</th><th>Waktu</th></tr>';
  for(const [k,v] of Object.entries(t)){
    html+=`<tr><td>${k}</td><td>${stripTZ(v)}</td></tr>`;
  }
  el('times').innerHTML=html;
  const next=computeNext(t);
  clearInterval(countdownInterval);
  updateTimeLeft(next);
  countdownInterval=setInterval(()=>{updateTimeLeft(next);sendToM5();},1000);
}

async function sendToM5(){
  try{
    const payload={clock:currentClock,countdown:currentCountdown,next:nextPrayerName};
    await fetch(M5CORE_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  }catch(e){console.log('Gagal kirim ke M5:',e);}
}

// auto refresh jadwal setiap 24 jam
setInterval(async()=>{
  if(!lastData)return;
  const c=el('city').value.trim(),cn=el('country').value.trim(),m=el('method').value;
  if(c&&cn){try{const d=await fetchByCity(c,cn,m);updateUI(d);}catch(e){console.log('Auto-refresh gagal:',e);}}
},86400000);

el('btnLoad').addEventListener('click',async()=>{
  const c=el('city').value.trim(),cn=el('country').value.trim(),m=el('method').value;
  if(!c||!cn){alert('Isi Kota dan Negara!');return;}
  try{const d=await fetchByCity(c,cn,m);updateUI(d);}catch(e){alert('Gagal ambil data.');}
});
</script>
</body>
</html>

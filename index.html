<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>🕌 Aplikasi Jam Sholat</title>
<style>
body {
  font-family: 'Segoe UI', sans-serif;
  background: #f8fafc;
  color: #222;
  padding: 20px;
}
.card {
  background: #fff;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 15px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}
button {
  padding: 8px 12px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  background: #22c55e;
  color: white;
  font-weight: bold;
}
.alert {
  padding: 10px;
  margin-top: 10px;
  border-radius: 8px;
}
.alert.error {
  background: rgba(239,68,68,.1);
  border: 1px solid rgba(239,68,68,.3);
}
.alert.info {
  background: rgba(59,130,246,.1);
  border: 1px solid rgba(59,130,246,.3);
}
#timeleft {
  font-size: 3em;
  color: #16a34a;
  font-weight: bold;
  text-align: center;
  opacity: 1;
  transition: opacity 0.6s ease;
}
#clock {
  font-size: 1.2em;
  text-align: center;
  margin-top: 5px;
  color: #555;
}
h1 {
  text-align: center;
}
table {
  width: 100%;
  color: #333;
  margin-top: 10px;
  border-collapse: collapse;
}
table td, table th {
  padding: 4px 6px;
}
</style>
</head>
<body>
<h1>🕌 Aplikasi Jam Sholat</h1>
<div id="timeleft">00:00:00</div>
<div id="clock">00:00:00</div>

<div class="card">
  <label>Kota</label>
  <input id="city" placeholder="Contoh: Bandung" />
  <label>Negara</label>
  <input id="country" placeholder="Contoh: Indonesia" />
  <label>Latitude</label>
  <input id="lat" placeholder="Contoh: -6.9147" />
  <label>Longitude</label>
  <input id="lon" placeholder="Contoh: 107.6098" />
  <label>Metode Perhitungan</label>
  <select id="method">
    <option value="12">Syafi'i (University of Islamic Sciences, Karachi)</option>
    <option value="1">Hanafi (Muslim World League)</option>
    <option value="3">Islamic Modern (ISNA)</option>
    <option value="4">Umm Al-Qura, Makkah</option>
  </select>
  <label>Madhab (Ashar)</label>
  <select id="madhab">
    <option value="0">Shafi'i</option>
    <option value="1">Hanafi</option>
  </select>
  <h3>Penyesuaian (menit)</h3>
  <small>Tambahkan/kurangi menit untuk menyesuaikan waktu sholat lokal</small><br>
  <label>Fajr</label><input id="adjFajr" type="number" value="0" />
  <label>Dhuhr</label><input id="adjDhuhr" type="number" value="0" />
  <label>Asr</label><input id="adjAsr" type="number" value="0" />
  <label>Maghrib</label><input id="adjMaghrib" type="number" value="0" />
  <label>Isha</label><input id="adjIsha" type="number" value="0" />
  <button id="btnLoad">Tampilkan Waktu</button>
</div>

<div id="alert" class="alert info" style="display:none"></div>
<table id="times"></table>

<script>
const el = id => document.getElementById(id);
const alertBox = el('alert');
let countdownInterval;

function showAlert(type, msg) {
  alertBox.className = 'alert ' + type;
  alertBox.style.display = 'block';
  alertBox.textContent = msg;
}
function clearAlert() { alertBox.style.display = 'none'; }
function stripTZ(s){return (s||'').toString().match(/\d{1,2}:\d{2}/)?.[0]||s;}
function composeDateTime(timeStr){const [h,m]=stripTZ(timeStr).split(':').map(Number);const now=new Date();return new Date(now.getFullYear(),now.getMonth(),now.getDate(),h||0,m||0,0);}
function adjustTime(timeStr,offset){const dt=composeDateTime(timeStr);dt.setMinutes(dt.getMinutes()+offset);return `${dt.getHours().toString().padStart(2,'0')}:${dt.getMinutes().toString().padStart(2,'0')}`;}
function computeNext(t){const order=['Fajr','Sunrise','Dhuhr','Asr','Maghrib','Isha'];const now=Date.now();for(const key of order){const dt=composeDateTime(t[key]);if(dt.getTime()>now+1000)return{key,at:dt};}const tomorrow=new Date(Date.now()+86400000);const [h,m]=stripTZ(t['Fajr']).split(':').map(Number);const dt=new Date(tomorrow.getFullYear(),tomorrow.getMonth(),tomorrow.getDate(),h||0,m||0,0);return{key:'Fajr',at:dt};}
async function fetchByCity(city,country,method,madhab){const url=`https://api.aladhan.com/v1/timingsByCity?city=${encodeURIComponent(city)}&country=${encodeURIComponent(country)}&method=${method}&madhab=${madhab}`;const r=await fetch(url);const j=await r.json();if(j.code!==200)throw new Error('Gagal mengambil data');return j.data;}
async function fetchByCoords(lat,lon,method,madhab){const url=`https://api.aladhan.com/v1/timings?latitude=${lat}&longitude=${lon}&method=${method}&madhab=${madhab}`;const r=await fetch(url);const j=await r.json();if(j.code!==200)throw new Error('Gagal mengambil data');return j.data;}
function applyAdjustments(t){return{
  Fajr:adjustTime(t.Fajr,Number(el('adjFajr').value||0)),
  Sunrise:t.Sunrise,
  Dhuhr:adjustTime(t.Dhuhr,Number(el('adjDhuhr').value||0)),
  Asr:adjustTime(t.Asr,Number(el('adjAsr').value||0)),
  Maghrib:adjustTime(t.Maghrib,Number(el('adjMaghrib').value||0)),
  Isha:adjustTime(t.Isha,Number(el('adjIsha').value||0))
};}
function updateClock(){
  const now=new Date();
  const h=String(now.getHours()).padStart(2,'0');
  const m=String(now.getMinutes()).padStart(2,'0');
  const s=String(now.getSeconds()).padStart(2,'0');
  el('clock').textContent=`${h}:${m}:${s}`;
}
setInterval(updateClock,1000);

// efek fade
function fadeOut(element, duration=500){element.style.transition=`opacity ${duration}ms`;element.style.opacity=0;}
function fadeIn(element, duration=500){element.style.transition=`opacity ${duration}ms`;element.style.opacity=1;}

function updateTimeLeft(next, t) {
  const now = new Date();
  const diff = next.at - now;

  if (diff <= 0) {
    el('timeleft').textContent = "00:00:00";
    // tunggu 1 menit baru ganti jadwal berikutnya
    setTimeout(() => {
      fadeOut(el('timeleft'), 600);
      setTimeout(() => {
        const newNext = computeNext(t);
        clearInterval(countdownInterval);
        fadeIn(el('timeleft'), 600);
        updateTimeLeft(newNext, t);
        countdownInterval = setInterval(() => updateTimeLeft(newNext, t), 1000);
      }, 800);
    }, 60000);
    return;
  }

  const totalSeconds = Math.floor(diff / 1000);
  const h = Math.floor(totalSeconds / 3600);
  const m = Math.floor((totalSeconds % 3600) / 60);
  const s = totalSeconds % 60;
  const formatted = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  el('timeleft').textContent = formatted;
}

function updateUI(data){
  let t = data.timings;
  t = applyAdjustments(t);
  let html='<tr><th>Waktu</th><th>Jam</th></tr>';
  for(const [k,v] of Object.entries(t)){
    html+=`<tr><td>${k}</td><td>${stripTZ(v)}</td></tr>`;
  }
  el('times').innerHTML=html;
  showAlert('info','Jadwal berhasil dimuat.');

  const next = computeNext(t);
  clearInterval(countdownInterval);
  updateTimeLeft(next, t);
  countdownInterval=setInterval(()=>updateTimeLeft(next, t),1000);
}

el('btnLoad').addEventListener('click', async () => {
  clearAlert();
  const city = el('city').value.trim();
  const country = el('country').value.trim();
  const lat = el('lat').value.trim();
  const lon = el('lon').value.trim();
  const method = el('method').value;
  const madhab = el('madhab').value;

  try {
    let data;
    if (city && country) data = await fetchByCity(city, country, method, madhab);
    else if (lat && lon) {
      const latNum = Number(lat), lonNum = Number(lon);
      if (Number.isNaN(latNum) || Number.isNaN(lonNum))
        throw new Error('Koordinat tidak valid.');
      data = await fetchByCoords(latNum, lonNum, method, madhab);
    } else throw new Error('Isi Kota & Negara atau Koordinat.');

    updateUI(data);
  } catch (e) {
    showAlert('error', e.message || 'Terjadi kesalahan.');
  }
});
</script>
</body>
</html>

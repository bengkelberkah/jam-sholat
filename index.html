<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jam Sholat Sinkron Firebase</title>
<style>
body {
  font-family: 'Arial', sans-serif;
  background: #000;
  color: #0f0;
  text-align: center;
  margin: 0;
  padding: 10px;
}
h1 {font-size: 1.3em; color: #0ff;}
#clock {font-size: 2.5em; margin: 10px 0; font-weight: bold;}
#timeleft {font-size: 1.3em; margin-bottom: 15px;}
#nextPrayer {font-size: 1.1em; color: #fff;}
table {width: 100%; color: #0f0; font-size: 0.9em; border-collapse: collapse; margin-top: 10px;}
td, th {border: 1px solid #0f0; padding: 5px;}
button {background: #0f0; color: #000; padding: 8px 15px; border: none; border-radius: 5px; cursor: pointer;}
button:active {background: #0c0;}
input, select {
  margin: 5px; padding: 5px;
  width: 90%; border-radius: 5px;
  border: 1px solid #0f0; background: #000; color: #0f0;
}
.small {font-size: 0.8em; color: #888;}
</style>
</head>
<body>
<h1>🕌 JAM SHOLAT SINKRON ONLINE</h1>
<div id="clock">00:00:00</div>
<div id="timeleft">Menunggu data...</div>
<div id="nextPrayer"></div>

<div>
  <input id="city" placeholder="Kota (contoh: Bandung)" />
  <input id="country" placeholder="Negara (contoh: Indonesia)" />
  <input id="lat" placeholder="Latitude (contoh: -6.9147)" />
  <input id="lon" placeholder="Longitude (contoh: 107.6098)" />
  <select id="method">
    <option value="12">Syafi'i (Karachi)</option>
    <option value="1">Hanafi (MWL)</option>
    <option value="3">ISNA</option>
    <option value="4">Umm Al-Qura</option>
  </select>
  <select id="madhab">
    <option value="0">Shafi'i</option>
    <option value="1">Hanafi</option>
  </select>

  <h3>Penyesuaian Waktu (menit)</h3>
  <input id="adjFajr" type="number" placeholder="Fajr" />
  <input id="adjDhuhr" type="number" placeholder="Dhuhr" />
  <input id="adjAsr" type="number" placeholder="Asr" />
  <input id="adjMaghrib" type="number" placeholder="Maghrib" />
  <input id="adjIsha" type="number" placeholder="Isha" />

  <button id="btnLoad">Tampilkan & Simpan</button>
</div>

<table id="times"></table>
<p class="small">Auto sync ke Firebase + update setiap hari</p>

<script type="module">
// === Firebase ===
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-database.js";

// Firebase configuration kamu
const firebaseConfig = {
  apiKey: "AIzaSyBdkkgnyBXUBBCYszktz8SRxfQ5COtjqfI",
  authDomain: "jam-sholat-2893a.firebaseapp.com",
  databaseURL: "https://jam-sholat-2893a-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "jam-sholat-2893a",
  storageBucket: "jam-sholat-2893a.firebasestorage.app",
  messagingSenderId: "486960845021",
  appId: "1:486960845021:web:426d01bde35cc75dc58b34",
  measurementId: "G-P9PCD5FRPJ"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const el = id => document.getElementById(id);
let currentClock = '00:00:00';
let currentCountdown = '00:00:00';
let nextPrayerName = '-';
let countdownInterval;

// === Fungsi dasar ===
function stripTZ(s){return (s||'').toString().match(/\d{1,2}:\\d{2}/)?.[0]||s;}
function composeDateTime(t){const[h,m]=stripTZ(t).split(':').map(Number);const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate(),h,m,0);}
function adjustTime(t,o){const d=composeDateTime(t);d.setMinutes(d.getMinutes()+o);return `${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;}
function computeNext(t){const k=['Fajr','Sunrise','Dhuhr','Asr','Maghrib','Isha'];const now=Date.now();for(const key of k){const d=composeDateTime(t[key]);if(d.getTime()>now)return{key,at:d};}const tm=new Date(Date.now()+86400000);const[h,m]=stripTZ(t['Fajr']).split(':').map(Number);return{key:'Fajr',at:new Date(tm.getFullYear(),tm.getMonth(),tm.getDate(),h,m,0)};}

async function fetchByCoords(lat,lon,method,madhab){
  const url=`https://api.aladhan.com/v1/timings?latitude=${lat}&longitude=${lon}&method=${method}&madhab=${madhab}`;
  const r=await fetch(url);const j=await r.json();if(j.code!==200)throw new Error('Gagal ambil data');return j.data;
}
async function fetchByCity(city,country,method,madhab){
  const url=`https://api.aladhan.com/v1/timingsByCity?city=${encodeURIComponent(city)}&country=${encodeURIComponent(country)}&method=${method}&madhab=${madhab}`;
  const r=await fetch(url);const j=await r.json();if(j.code!==200)throw new Error('Gagal ambil data');return j.data;
}

function applyAdjustments(t){
  return {
    Fajr:adjustTime(t.Fajr,Number(el('adjFajr').value||0)),
    Sunrise:t.Sunrise,
    Dhuhr:adjustTime(t.Dhuhr,Number(el('adjDhuhr').value||0)),
    Asr:adjustTime(t.Asr,Number(el('adjAsr').value||0)),
    Maghrib:adjustTime(t.Maghrib,Number(el('adjMaghrib').value||0)),
    Isha:adjustTime(t.Isha,Number(el('adjIsha').value||0))
  };
}

function updateClock(){
  const n=new Date();
  const h=String(n.getHours()).padStart(2,'0');
  const m=String(n.getMinutes()).padStart(2,'0');
  const s=String(n.getSeconds()).padStart(2,'0');
  currentClock=`${h}:${m}:${s}`;
  el('clock').textContent=currentClock;
}
setInterval(updateClock,1000);

function updateTimeLeft(next){
  const now=new Date();
  const diff=next.at-now;
  if(diff<=0){el('timeleft').textContent='Masuk waktu sholat berikutnya';return;}
  const t=Math.floor(diff/1000),h=Math.floor(t/3600),m=Math.floor((t%3600)/60),s=t%60;
  currentCountdown=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  el('timeleft').textContent=`Menuju ${next.key}: ${currentCountdown}`;
  el('nextPrayer').textContent=`Sholat berikutnya: ${next.key}`;
  nextPrayerName=next.key;
}

function updateUI(data){
  let t=data.timings;
  t=applyAdjustments(t);
  let html='<tr><th>Sholat</th><th>Waktu</th></tr>';
  for(const [k,v] of Object.entries(t)){
    html+=`<tr><td>${k}</td><td>${stripTZ(v)}</td></tr>`;
  }
  el('times').innerHTML=html;
  const next=computeNext(t);
  clearInterval(countdownInterval);
  updateTimeLeft(next);
  countdownInterval=setInterval(()=>{updateTimeLeft(next);},1000);
}

// === Simpan semua setting ke Firebase ===
async function saveToFirebase(){
  const data={
    city:el('city').value.trim(),
    country:el('country').value.trim(),
    lat:el('lat').value.trim(),
    lon:el('lon').value.trim(),
    method:el('method').value,
    madhab:el('madhab').value,
    adjFajr:el('adjFajr').value,
    adjDhuhr:el('adjDhuhr').value,
    adjAsr:el('adjAsr').value,
    adjMaghrib:el('adjMaghrib').value,
    adjIsha:el('adjIsha').value
  };
  await set(ref(db,'settings/'),data);
}

// === Sync realtime dari Firebase ===
onValue(ref(db,'settings/'), async (snapshot)=>{
  const s=snapshot.val();
  if(!s)return;
  for(const [k,v] of Object.entries(s)){if(el(k))el(k).value=v;}
  try{
    let data;
    if(s.city && s.country) data=await fetchByCity(s.city,s.country,s.method,s.madhab);
    else if(s.lat && s.lon) data=await fetchByCoords(s.lat,s.lon,s.method,s.madhab);
    updateUI(data);
  }catch(e){console.error('Gagal ambil data:',e);}
});

// === Tombol klik: simpan & tampilkan ===
el('btnLoad').addEventListener('click', async ()=>{
  await saveToFirebase();
  const s={
    city:el('city').value.trim(),
    country:el('country').value.trim(),
    lat:el('lat').value.trim(),
    lon:el('lon').value.trim(),
    method:el('method').value,
    madhab:el('madhab').value
  };
  let data;
  if(s.city&&s.country)data=await fetchByCity(s.city,s.country,s.method,s.madhab);
  else if(s.lat&&s.lon)data=await fetchByCoords(s.lat,s.lon,s.method,s.madhab);
  updateUI(data);
  alert('✅ Setting tersimpan & disinkronkan ke semua perangkat!');
});
</script>
</body>
</html>
